move:
  name: Move camera
  description: Send a relative MIPC pan/tilt command. Coordinate ranges are camera-dependent.
  fields:
    config_entry_id:
      name: Configuration entry ID
      description: Required ID of the target MIPC camera integration instance.
      required: true
      selector:
        config_entry:
          integration: mipc_camera
    x:
      name: Pan
      description: Relative horizontal movement, -360 to 360.
      required: true
      selector:
        number:
          min: -360
          max: 360
          mode: box
    y:
      name: Tilt
      description: Relative vertical movement, -360 to 360.
      required: true
      selector:
        number:
          min: -360
          max: 360
          mode: box
    pan_speed:
      name: Pan speed
      description: Optional horizontal speed override.
      selector:
        number:
          min: 1
          max: 100
          mode: box
    tilt_speed:
      name: Tilt speed
      description: Optional vertical speed override.
      selector:
        number:
          min: 1
          max: 100
          mode: box

factory_reset:
  name: Factory reset camera
  description: Erase camera settings, credentials and networking. Physical access may be needed to reconnect. This cannot be undone.
  fields:
    config_entry_id:
      name: Configuration entry ID
      description: The MIPC camera to erase.
      required: true
      selector:
        config_entry:
          integration: mipc_camera
    confirm:
      name: Confirm factory reset
      description: Must be explicitly true to erase the camera.
      required: true
      default: false
      selector:
        boolean:
